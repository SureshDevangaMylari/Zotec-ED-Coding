# Spring AI — used by wl.ai.rag.rag_spring.RagAlphaSpringService for embeddings.
# Self-hosted OpenAI-compatible stack: set base URL and model to match wl.ai.LLMService.
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy}
spring.ai.openai.base-url=http://10.1.242.218:8000/v1
spring.ai.openai.embedding.options.model=Qwen/Qwen3-Embedding-0.6B

# Web UI on localhost:8080 (Start/Stop Agent). Bot still uses outbound document APIs.
spring.main.web-application-type=servlet
server.port=8080

# Document processor — upload + review poll
# Upload: multipart file (PDF/text) + form_data JSON (well + client_location)
# Auth: x-bot-secret + x-desktop-id (same as bot.poll.*)
document.upload.url=http://10.1.242.218:8000/upload
document.api-key=02ed3a18bf4cb0a295662e805a7219bedb957c0e99af109024416c84235acad4
document.review.base-url=http://10.1.242.218:8000
document.review.poll-interval-seconds=5
batch.resume.timeout-minutes=60

# Document queue cleanup auth (POST /auth/login before GET/DELETE /documents)
document.auth.login-url=http://10.1.242.218:8000/auth/login


# Start bot only when UI Start Agent is clicked (not on Spring Boot startup)
flow.auto-start=false
flow.agent-id=698ae5c9b0bf82d7668c29c8

# Desk credentials for upload + review (x-bot-secret / x-desktop-id) — not used for Zotec login
bot.poll.url=http://10.1.242.218:8000/bot/poll

#Portal URL
zotec.portal.URL=https://coding.zotecpartners.com/

# Chrome profile for Start Agent (extensions + sessions). Close Chrome first.
# Leave user-data-dir empty for OS default:
#   Windows: %LOCALAPPDATA%\Google\Chrome\User Data  (launched via CDP — persistent context hangs)
#   Linux:   ~/.config/google-chrome                 (Playwright persistent context)
# Optional: zotec.chrome.executable=/usr/bin/google-chrome-stable
zotec.chrome.user-data-dir=
zotec.chrome.profile-directory=Default
zotec.chrome.debugging-port=9222
zotec.chrome.executable=

